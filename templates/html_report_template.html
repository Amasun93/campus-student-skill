<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校区分析报告</title>
<!-- Chart.js CDN，离线时自动降级为纯CSS图表 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ===== 全局样式 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "微软雅黑", -apple-system, sans-serif;
  background: #f5f7fa; color: #333; line-height: 1.6;
}
.page {
  display: none; min-height: 100vh; padding: 24px;
}
.page.active { display: block; }
.page-header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff; padding: 24px 32px; border-radius: 12px; margin-bottom: 24px;
}
.page-header h1 { font-size: 24px; margin-bottom: 8px; }
.page-header .subtitle { font-size: 14px; opacity: 0.9; }
/* ===== 导航 ===== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  display: flex; padding: 0 24px; height: 56px; align-items: center;
}
.nav-brand { font-size: 18px; font-weight: bold; color: #667eea; margin-right: 32px; }
.nav-tabs { display: flex; gap: 8px; }
.nav-tab {
  padding: 8px 20px; border-radius: 8px; cursor: pointer;
  font-size: 14px; color: #666; transition: all 0.2s; border: none;
  background: transparent;
}
.nav-tab:hover { background: #f0f0f0; }
.nav-tab.active { background: #667eea; color: #fff; }
.content-wrapper { margin-top: 72px; max-width: 1400px; margin-left: auto; margin-right: auto; }
/* ===== 卡片 ===== */
.card {
  background: #fff; border-radius: 12px; padding: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px;
}
.card-title { font-size: 18px; font-weight: bold; margin-bottom: 16px; color: #333; }
/* ===== 表格 ===== */
.data-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.data-table th {
  background: #667eea; color: #fff; padding: 10px 12px;
  text-align: left; position: sticky; top: 0; cursor: pointer;
  white-space: nowrap;
}
.data-table th:hover { background: #5568d3; }
.data-table td {
  padding: 8px 12px; border-bottom: 1px solid #eee;
}
.data-table tr:hover { background: #f8f9ff; }
/* 筛选栏 */
.filter-bar {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center;
}
.filter-bar select, .filter-bar input {
  padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px;
  font-size: 13px; outline: none;
}
.filter-bar select:focus, .filter-bar input:focus { border-color: #667eea; }
.filter-label { font-size: 13px; color: #666; font-weight: 600; }
/* ===== 统计卡片 ===== */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.stat-card {
  background: #fff; border-radius: 12px; padding: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center;
}
.stat-value { font-size: 32px; font-weight: bold; color: #667eea; }
.stat-label { font-size: 13px; color: #888; margin-top: 4px; }
.stat-card.high .stat-value { color: #e74c3c; }
.stat-card.medium .stat-value { color: #f39c12; }
.stat-card.low .stat-value { color: #27ae60; }
/* ===== 图表容器 ===== */
.chart-container {
  background: #fff; border-radius: 12px; padding: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px;
}
.chart-container canvas { max-height: 350px; }
/* ===== 标签徽章 ===== */
.tag {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 12px; font-weight: 600;
}
.tag-high { background: #fde8e8; color: #e74c3c; }
.tag-medium { background: #fef5e0; color: #f39c12; }
.tag-low { background: #e8f8ec; color: #27ae60; }
.tag-neutral { background: #eef0f5; color: #666; }
/* ===== 优先级星 ===== */
.stars { color: #f39c12; letter-spacing: 2px; }
/* ===== 纯CSS柱状图降级 ===== */
.css-bar-chart { display: flex; flex-direction: column; gap: 10px; }
.css-bar-item { display: flex; align-items: center; gap: 12px; }
.css-bar-label { width: 120px; font-size: 13px; text-align: right; color: #666; }
.css-bar-track { flex: 1; height: 24px; background: #f0f0f0; border-radius: 12px; overflow: hidden; }
.css-bar-fill { height: 100%; border-radius: 12px; transition: width 0.5s; }
.css-bar-value { width: 60px; font-size: 13px; color: #333; font-weight: 600; }
/* ===== 页脚 ===== */
.footer {
  text-align: center; padding: 20px; color: #aaa; font-size: 12px;
}

/* ===== 移动端顶部栏（默认隐藏，手机端显示）===== */
.mobile-top-bar {
  display: none;
}

/* ===== 表格滚动提示（默认隐藏，手机端显示）===== */
.table-scroll-hint {
  display: none;
}

/* ===== 平板端适配（481px ~ 768px）===== */
@media (max-width: 768px) {
  .page { padding: 16px; }
  .page-header { padding: 16px 20px; margin-bottom: 16px; }
  .page-header h1 { font-size: 20px; }
  .card { padding: 18px; }
  .card-title { font-size: 16px; }
  .chart-container { padding: 18px; }
  .chart-container canvas { max-height: 300px; }
  .stats-grid { gap: 12px; }
  .stat-card { padding: 16px; }
  .stat-value { font-size: 28px; }
  .nav { padding: 0 16px; }
  .nav-brand { font-size: 16px; margin-right: 16px; }
  .nav-tab { padding: 6px 14px; font-size: 13px; }
  .filter-bar { gap: 8px; }
}

/* ===== 手机端适配（≤480px）===== */
@media (max-width: 480px) {
  /* --- 移动端顶部栏 --- */
  .mobile-top-bar {
    display: flex;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    height: 44px;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  /* --- 导航改为底部固定 tab bar --- */
  .nav {
    position: fixed;
    top: auto;
    bottom: 0;
    left: 0; right: 0;
    height: 56px;
    padding: 0;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
    border-radius: 0;
  }
  .nav-brand { display: none; }
  .nav-tabs {
    flex: 1;
    display: flex;
    gap: 0;
    height: 100%;
  }
  .nav-tab {
    flex: 1;
    padding: 8px 4px;
    font-size: 13px;
    border-radius: 0;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  .nav-tab:hover { background: transparent; }
  .nav-tab.active { background: #667eea; color: #fff; }

  /* --- 内容区适配 --- */
  .content-wrapper {
    margin-top: 44px;
    padding-bottom: 70px;
  }
  .page { padding: 12px; }
  .page-header {
    padding: 14px 16px;
    margin-bottom: 14px;
    border-radius: 10px;
  }
  .page-header h1 { font-size: 18px; margin-bottom: 4px; }
  .page-header .subtitle { font-size: 12px; }

  /* --- 卡片 --- */
  .card { padding: 14px; border-radius: 10px; margin-bottom: 14px; }
  .card-title { font-size: 15px; margin-bottom: 12px; }

  /* --- 统计卡片网格 --- */
  .stats-grid {
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat-card { padding: 14px 10px; border-radius: 10px; }
  .stat-value { font-size: 24px; }
  .stat-label { font-size: 12px; }

  /* --- 图表 --- */
  .chart-container { padding: 14px; border-radius: 10px; margin-bottom: 14px; }
  .chart-container canvas { max-height: 260px; }

  /* --- 纯CSS柱状图 --- */
  .css-bar-chart { gap: 8px; }
  .css-bar-label { width: 80px; font-size: 12px; }
  .css-bar-value { width: 40px; font-size: 12px; }
  .css-bar-track { height: 20px; }

  /* --- 表格 --- */
  .data-table { font-size: 13px; }
  .data-table th { padding: 6px 8px; }
  .data-table td { padding: 6px 8px; }

  /* --- 表格滚动提示（手机端显示）--- */
  .table-scroll-hint {
    display: block;
    text-align: center;
    padding: 6px;
    color: #aaa;
    font-size: 12px;
    background: #f8f9fa;
    border-radius: 6px;
    margin-bottom: 8px;
  }

  /* --- 筛选栏 --- */
  .filter-bar { gap: 6px; }
  .filter-bar select, .filter-bar input {
    padding: 5px 10px;
    font-size: 12px;
  }
  .filter-label { font-size: 12px; }

  /* --- 页脚（留出底部导航空间）--- */
  .footer { padding: 16px 12px 10px; font-size: 11px; }
}
</style>
</head>
<body>

<!-- 移动端顶部栏（仅手机显示，缩略品牌标题） -->
<div class="mobile-top-bar">校区分析报告</div>

<!-- 导航栏 -->
<nav class="nav">
  <div class="nav-brand">校区分析报告</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('page1')">全员表格</button>
    <button class="nav-tab" onclick="showPage('page2')">校区分析</button>
    <button class="nav-tab" onclick="showPage('page3')">产品推荐</button>
  </div>
</nav>

<div class="content-wrapper">

<!-- ===== 页1：全员表格+筛选 ===== -->
<div class="page active" id="page1">
  <div class="page-header">
    <h1>全员学员表格</h1>
    <div class="subtitle">支持按校区/年级/支付力/风险等筛选排序</div>
  </div>
  <div class="card">
    <div class="filter-bar">
      <span class="filter-label">筛选：</span>
      <select id="filter-campus" onchange="applyFilters()"><option value="">全部校区</option></select>
      <select id="filter-grade" onchange="applyFilters()"><option value="">全部年级</option></select>
      <select id="filter-payment" onchange="applyFilters()"><option value="">全部支付力</option></select>
      <select id="filter-risk" onchange="applyFilters()"><option value="">全部风险</option></select>
      <input type="text" id="filter-name" placeholder="搜索姓名..." oninput="applyFilters()">
    </div>
    <div class="table-scroll-hint">← 左右滑动查看更多 →</div>
    <div style="overflow-x:auto;">
      <table class="data-table" id="student-table">
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div id="table-empty" style="display:none;text-align:center;padding:40px;color:#aaa;">暂无数据</div>
  </div>
</div>

<!-- ===== 页2：校区分析报告 ===== -->
<div class="page" id="page2">
  <div class="page-header">
    <h1>校区分析报告</h1>
    <div class="subtitle">高净值用户占比、家长来源分布、学校层次分布等大数据分析</div>
  </div>
  <div class="stats-grid" id="stats-cards"></div>
  <div class="chart-container">
    <div class="card-title">家长来源小区分布</div>
    <canvas id="chart-community"></canvas>
    <div class="css-bar-chart" id="css-community" style="display:none;"></div>
  </div>
  <div class="chart-container">
    <div class="card-title">学校层次分布</div>
    <canvas id="chart-school"></canvas>
    <div class="css-bar-chart" id="css-school" style="display:none;"></div>
  </div>
  <div class="chart-container">
    <div class="card-title">决策标签分布</div>
    <canvas id="chart-tags"></canvas>
    <div class="css-bar-chart" id="css-tags" style="display:none;"></div>
  </div>
</div>

<!-- ===== 页3：产品推荐画像 ===== -->
<div class="page" id="page3">
  <div class="page-header">
    <h1>产品推荐画像</h1>
    <div class="subtitle">哪些家长适合推什么课 + 百分比 + 画像筛选</div>
  </div>
  <div class="stats-grid" id="recommend-cards"></div>
  <div class="chart-container">
    <div class="card-title">推荐课程分布</div>
    <canvas id="chart-recommend"></canvas>
    <div class="css-bar-chart" id="css-recommend" style="display:none;"></div>
  </div>
  <div class="card">
    <div class="card-title">推荐详情</div>
    <div class="filter-bar">
      <span class="filter-label">按推荐课程筛选：</span>
      <select id="filter-recommend" onchange="filterRecommend()"><option value="">全部</option></select>
    </div>
    <div class="table-scroll-hint">← 左右滑动查看更多 →</div>
    <div style="overflow-x:auto;">
      <table class="data-table" id="recommend-table">
        <thead><tr><th>姓名</th><th>年级</th><th>支付力</th><th>推荐课程</th><th>推荐理由</th><th>跟进优先级</th></tr></thead>
        <tbody id="recommend-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer">
  <p>由校区学员情况管理 Skill 生成 | 校区小助手小朱</p>
  <p id="gen-time"></p>
</div>

</div>

<script>
// ===== 报告数据注入点 =====
// generate_html_report.py 会将数据注入到 REPORT_DATA 变量
const REPORT_DATA = {
  "生成时间": "",
  "校区": "",
  "学员列表": [],
  "统计": {}
};

// ===== 页面切换 =====
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  event.target.classList.add('active');
  window.scrollTo(0, 0);
}

// ===== 标签样式 =====
function tagClass(val) {
  if (val === '高') return 'tag tag-high';
  if (val === '中') return 'tag tag-medium';
  if (val === '低') return 'tag tag-low';
  return 'tag tag-neutral';
}

function starsHtml(n) {
  return '<span class="stars">' + '★'.repeat(n) + '☆'.repeat(5-n) + '</span>';
}

// ===== 页1：表格渲染 =====
function renderTable() {
  const data = REPORT_DATA.学员列表 || [];
  const columns = [
    {key:'校区', label:'校区'}, {key:'姓名', label:'姓名'}, {key:'年级', label:'年级'},
    {key:'居住小区', label:'居住小区'}, {key:'学校层次', label:'学校层次'},
    {key:'支付力', label:'支付力', isTag:true},
    {key:'续费风险', label:'续费风险', isTag:true},
    {key:'转介绍潜力', label:'转介绍潜力', isTag:true},
    {key:'跟进优先级', label:'跟进优先级', isStars:true},
    {key:'推荐方向', label:'推荐方向'}
  ];
  // 表头
  let headHtml = '<tr>';
  columns.forEach(c => { headHtml += '<th>' + c.label + '</th>'; });
  headHtml += '</tr>';
  document.getElementById('table-head').innerHTML = headHtml;

  // 填充筛选选项
  fillFilterOptions(data);

  // 渲染数据
  applyFilters();
}

function fillFilterOptions(data) {
  const campuses = [...new Set(data.map(d => d.校区).filter(Boolean))];
  const grades = [...new Set(data.map(d => d.年级).filter(Boolean))];
  const payments = ['高','中','低'];
  const risks = ['高','中','低'];

  fillSelect('filter-campus', campuses);
  fillSelect('filter-grade', grades);
  fillSelect('filter-payment', payments);
  fillSelect('filter-risk', risks);
}

function fillSelect(id, options) {
  const sel = document.getElementById(id);
  const current = sel.value;
  let html = '<option value="">全部</option>';
  options.forEach(o => { html += '<option value="' + o + '">' + o + '</option>'; });
  sel.innerHTML = html;
  sel.value = current;
}

function applyFilters() {
  const data = REPORT_DATA.学员列表 || [];
  const fc = document.getElementById('filter-campus').value;
  const fg = document.getElementById('filter-grade').value;
  const fp = document.getElementById('filter-payment').value;
  const fr = document.getElementById('filter-risk').value;
  const fn = document.getElementById('filter-name').value.toLowerCase();

  const filtered = data.filter(d => {
    if (fc && d.校区 !== fc) return false;
    if (fg && d.年级 !== fg) return false;
    if (fp && d.支付力 !== fp) return false;
    if (fr && d.续费风险 !== fr) return false;
    if (fn && !d.姓名.toLowerCase().includes(fn)) return false;
    return true;
  });

  const columns = [
    {key:'校区'}, {key:'姓名'}, {key:'年级'}, {key:'居住小区'}, {key:'学校层次'},
    {key:'支付力', isTag:true}, {key:'续费风险', isTag:true},
    {key:'转介绍潜力', isTag:true}, {key:'跟进优先级', isStars:true},
    {key:'推荐方向'}
  ];

  let bodyHtml = '';
  filtered.forEach(d => {
    bodyHtml += '<tr>';
    columns.forEach(c => {
      let val = d[c.key] || '';
      if (c.isTag && val) val = '<span class="' + tagClass(val) + '">' + val + '</span>';
      if (c.isStars) val = starsHtml(parseInt(val) || 0);
      bodyHtml += '<td>' + val + '</td>';
    });
    bodyHtml += '</tr>';
  });

  document.getElementById('table-body').innerHTML = bodyHtml;
  document.getElementById('table-empty').style.display = filtered.length === 0 ? 'block' : 'none';
}

// ===== 页2：校区分析 =====
function renderAnalysis() {
  const stats = REPORT_DATA.统计 || {};
  // 统计卡片
  const cards = [
    {label:'总人数', value: stats.总人数 || 0, cls:''},
    {label:'高净值占比', value: stats.高净值占比 || '0%', cls:'high'},
    {label:'续费高风险占比', value: stats.续费高风险占比 || '0%', cls:'high'},
    {label:'高转介绍潜力占比', value: stats.高转介绍潜力占比 || '0%', cls:'low'}
  ];
  let cardsHtml = '';
  cards.forEach(c => {
    cardsHtml += '<div class="stat-card ' + c.cls + '"><div class="stat-value">' + c.value + '</div><div class="stat-label">' + c.label + '</div></div>';
  });
  document.getElementById('stats-cards').innerHTML = cardsHtml;

  // 图表
  renderChart('chart-community', 'css-community', stats.家长来源小区分布 || [], '小区', '人数');
  renderChart('chart-school', 'css-school', stats.学校层次分布 || [], '层次', '人数');
  renderTagsChart(stats);
}

function renderChart(canvasId, cssId, data, labelKey, valueKey) {
  const labels = data.map(d => d[labelKey] || d.小区 || d.层次 || d.课程 || d.标签 || '');
  const values = data.map(d => d[valueKey] || d.人数 || d.占比 || 0);

  if (typeof Chart !== 'undefined') {
    const ctx = document.getElementById(canvasId).getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: valueKey,
          data: values,
          backgroundColor: '#667eea',
          borderRadius: 6
        }]
      },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });
  } else {
    // 纯CSS降级
    document.getElementById(canvasId).style.display = 'none';
    document.getElementById(cssId).style.display = 'flex';
    let html = '';
    const max = Math.max(...values, 1);
    const colors = ['#667eea','#764ba2','#f39c12','#27ae60','#e74c3c','#3498db'];
    data.forEach((d, i) => {
      const val = d[valueKey] || d.人数 || d.占比 || 0;
      const pct = (val / max * 100) + '%';
      const label = d[labelKey] || d.小区 || d.层次 || d.课程 || d.标签 || '';
      html += '<div class="css-bar-item"><div class="css-bar-label">' + label + '</div>';
      html += '<div class="css-bar-track"><div class="css-bar-fill" style="width:' + pct + ';background:' + colors[i % colors.length] + ';"></div></div>';
      html += '<div class="css-bar-value">' + val + '</div></div>';
    });
    document.getElementById(cssId).innerHTML = html;
  }
}

function renderTagsChart(stats) {
  const data = REPORT_DATA.学员列表 || [];
  const tagDist = { '支付力': {'高':0,'中':0,'低':0}, '续费风险': {'高':0,'中':0,'低':0}, '转介绍潜力': {'高':0,'中':0,'低':0} };
  data.forEach(d => {
    if (d.支付力) tagDist['支付力'][d.支付力] = (tagDist['支付力'][d.支付力]||0)+1;
    if (d.续费风险) tagDist['续费风险'][d.续费风险] = (tagDist['续费风险'][d.续费风险]||0)+1;
    if (d.转介绍潜力) tagDist['转介绍潜力'][d.转介绍潜力] = (tagDist['转介绍潜力'][d.转介绍潜力]||0)+1;
  });

  const labels = [], values = [], bgColors = [];
  const colors = {'高':'#e74c3c','中':'#f39c12','低':'#27ae60'};
  Object.keys(tagDist).forEach(tag => {
    Object.keys(tagDist[tag]).forEach(level => {
      labels.push(tag + '-' + level);
      values.push(tagDist[tag][level]);
      bgColors.push(colors[level]);
    });
  });

  if (typeof Chart !== 'undefined') {
    const ctx = document.getElementById('chart-tags').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: { labels: labels, datasets: [{ data: values, backgroundColor: bgColors, borderRadius: 6 }] },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });
  } else {
    document.getElementById('chart-tags').style.display = 'none';
    document.getElementById('css-tags').style.display = 'flex';
    let html = '';
    const max = Math.max(...values, 1);
    labels.forEach((l, i) => {
      const pct = (values[i] / max * 100) + '%';
      html += '<div class="css-bar-item"><div class="css-bar-label">' + l + '</div>';
      html += '<div class="css-bar-track"><div class="css-bar-fill" style="width:' + pct + ';background:' + bgColors[i] + ';"></div></div>';
      html += '<div class="css-bar-value">' + values[i] + '</div></div>';
    });
    document.getElementById('css-tags').innerHTML = html;
  }
}

// ===== 页3：产品推荐 =====
function renderRecommend() {
  const data = REPORT_DATA.学员列表 || [];
  const stats = REPORT_DATA.统计 || {};

  // 推荐统计卡片
  const recDist = stats.推荐分布 || [];
  let cardsHtml = '';
  recDist.forEach(r => {
    cardsHtml += '<div class="stat-card"><div class="stat-value">' + (r.占比 || '0%') + '</div><div class="stat-label">' + (r.课程 || '待配置') + ' (' + (r.人数||0) + '人)</div></div>';
  });
  document.getElementById('recommend-cards').innerHTML = cardsHtml;

  // 推荐分布图
  renderChart('chart-recommend', 'css-recommend', recDist, '课程', '人数');

  // 推荐详情表
  const courses = [...new Set(data.map(d => d.推荐方向).filter(Boolean))];
  fillSelect('filter-recommend', courses);

  renderRecommendTable('');
}

function filterRecommend() {
  const course = document.getElementById('filter-recommend').value;
  renderRecommendTable(course);
}

function renderRecommendTable(course) {
  const data = REPORT_DATA.学员列表 || [];
  const filtered = course ? data.filter(d => d.推荐方向 === course) : data;
  let html = '';
  filtered.forEach(d => {
    html += '<tr>';
    html += '<td>' + (d.姓名||'') + '</td>';
    html += '<td>' + (d.年级||'') + '</td>';
    html += '<td><span class="' + tagClass(d.支付力) + '">' + (d.支付力||'') + '</span></td>';
    html += '<td>' + (d.推荐方向||'待配置') + '</td>';
    html += '<td>' + (d.推荐理由||'') + '</td>';
    html += '<td>' + starsHtml(parseInt(d.跟进优先级)||0) + '</td>';
    html += '</tr>';
  });
  document.getElementById('recommend-body').innerHTML = html;
}

// ===== 初始化 =====
window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('gen-time').textContent = '生成时间：' + (REPORT_DATA.生成时间 || '');
  renderTable();
  renderAnalysis();
  renderRecommend();
});
</script>
